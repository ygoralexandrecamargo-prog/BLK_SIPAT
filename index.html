<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPAT Quiz 2026 — Balaska</title>
    <style>
        /* SEU CSS ORIGINAL COMPLETO */
        :root {
            --navy: #040810; --navy2: #07122A; --blue: #0D3B8C; --blue2: #1450B8;
            --gold: #1A6FE8; --amber: #0D3B8C; --green: #00E676; --red: #FF1744;
            --white: #E8EEFF; --muted: #4D6899; --card: rgba(7,18,42,0.85);
            --border: rgba(20,80,184,0.35); --radius: 18px;
            --balaska-blue: #1450B8;
        }

        *,::before,::after { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', sans-serif; background: var(--navy);
            color: var(--white); overflow: hidden; height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        /* O FUNDO DE GRADE QUE VOCÊ CRIOU */
        #bg {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(ellipse 100% 100% at 50% 50%, #040810 35%, #000408 100%);
        }
        #bg::after {
            content: ''; position: absolute; inset: 0;
            background-image: linear-gradient(rgba(20,80,184,0.06) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(20,80,184,0.06) 1px, transparent 1px);
            background-size: 52px 52px;
        }

        .screen { display: none; flex-direction: column; align-items: center; text-align: center; width: 100%; z-index: 1; }
        .screen.active { display: flex; }

        /* TÍTULO GIGANTE DA IMAGEM */
        .big-title {
            font-family: Impact, sans-serif; font-size: clamp(80px,15vw,140px);
            line-height: .9; letter-spacing: 2px; margin-bottom: 20px;
            background: linear-gradient(135deg,#ffffff 0%,#7EB8FF 45%,var(--balaska-blue) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .logo-ring { 
            width: 180px; height: 80px; background: white; 
            border-radius: 14px; display: flex; align-items: center; 
            justify-content: center; margin-bottom: 20px; 
        }
        .logo-ring img { width: 90%; }

        .stats-row { display: flex; gap: 15px; margin-bottom: 40px; }
        .stat { 
            background: var(--card); border: 1px solid var(--border); 
            padding: 15px 25px; border-radius: 14px; 
        }
        .stat b { display: block; font-size: 35px; color: #7EB8FF; font-family: Impact; }
        .stat span { font-size: 10px; color: var(--muted); text-transform: uppercase; }

        .btn { 
            font-weight: 900; font-size: 18px; padding: 20px 60px; 
            border-radius: 50px; border: none; cursor: pointer; text-transform: uppercase;
        }
        .btn-gold { 
            background: linear-gradient(135deg, var(--balaska-blue), #1A6FE8); 
            color: white; box-shadow: 0 8px 30px rgba(20,80,184,0.5); 
        }

        /* ESTILO DOS CARDS DE PERGUNTA */
        .q-card { 
            background: var(--card); border: 1px solid var(--border);
            padding: 40px; border-radius: var(--radius); width: 90%; max-width: 600px;
        }
        input, select {
            width: 100%; padding: 15px; margin: 10px 0; 
            background: #0d1a35; border: 1px solid var(--border);
            color: white; border-radius: 10px;
        }
    </style>
</head>
<body>

<div id="bg"></div>

<!-- TELA INICIAL (IGUAL À FOTO) -->
<div id="screen-start" class="screen active">
    <div class="logo-ring">
        <img src="https://balaska.com.br/wp-content/uploads/2022/01/logo-balaska.png" alt="Balaska">
    </div>
    <div class="big-title">QUIZ</div>
    <div class="stats-row">
        <div class="stat"><b>50</b><span>Perguntas</span></div>
        <div class="stat"><b>10</b><span>Grupos</span></div>
    </div>
    <button class="btn btn-gold" onclick="next('screen-register')">▶ JOGAR AGORA</button>
</div>

<!-- TELA DE REGISTRO -->
<div id="screen-register" class="screen">
    <div class="q-card">
        <h2 style="margin-bottom:20px">Identifique-se</h2>
        <input type="text" id="pName" placeholder="Seu Nome Completo">
        <select id="pDept">
            <option value="">Selecione seu Setor</option>
            <option>Produção</option>
            <option>Logística</option>
            <option>Vendas</option>
            <option>Administrativo</option>
        </select>
        <button class="btn btn-gold" style="margin-top:20px" onclick="start()">INICIAR</button>
    </div>
</div>

<script>
    function next(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function start() {
        const name = document.getElementById('pName').value;
        if(!name) return alert("Por favor, digite seu nome.");
        alert("Iniciando o Quiz para: " + name);
        // Aqui entra a lógica das perguntas que configuramos antes
    }
</script>

</body>
</html>
