<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIPAT Quiz 2026 — Balaska Equipamentos</title>

<style>
/* ============================================================
   SEU ESTILO ORIGINAL PRESERVADO
   ============================================================ */
:root {
  --navy:    #040810;
  --navy2:   #07122A;
  --blue:    #0D3B8C;
  --blue2:   #1450B8;
  --gold:    #1A6FE8;
  --amber:   #0D3B8C;
  --green:   #00E676;
  --red:     #FF1744;
  --white:   #E8EEFF;
  --muted:   #4D6899;
  --card:    rgba(7,18,42,0.85);
  --border:  rgba(20,80,184,0.35);
  --radius:  18px;
  --glow-g:  0 0 28px rgba(0,230,118,0.45);
  --glow-r:  0 0 28px rgba(255,23,68,0.45);
  --glow-y:  0 0 28px rgba(20,80,184,0.5);
  --balaska-blue: #1450B8;
  --balaska-dark: #07122A;
  --accent:  #FFFFFF;
}

*,::before,::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: var(--navy);
  color: var(--white);
  display: flex; align-items: center; justify-content: center;
}

#bg {
  position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(ellipse 100% 100% at 50% 50%, #040810 35%, #000408 100%);
}
#bg::after {
  content: ''; position: absolute; inset: 0;
  background-image: linear-gradient(rgba(20,80,184,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(20,80,184,0.06) 1px, transparent 1px);
  background-size: 52px 52px;
}

.screen { position: relative; z-index: 1; display: none; width: 100vw; height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.screen.active { display: flex; }

.big-title {
  font-family: Impact, sans-serif; font-size: clamp(80px,13vw,140px); line-height: .9; letter-spacing: 2px;
  background: linear-gradient(135deg,#ffffff 0%,#7EB8FF 45%,var(--balaska-blue) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

.logo-ring { width:180px; height:80px; border-radius:14px; background: white; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
.logo-ring img { width:92%; object-fit:contain; }

.stats-row { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-bottom:36px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 22px; text-align: center; }
.stat b { display: block; font-family: Impact; font-size: 38px; color: #7EB8FF; }
.stat span { font-size:10px; color:var(--muted); text-transform:uppercase; }

.btn { font-weight: 900; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; border: none; border-radius: 50px; cursor: pointer; padding: 18px 60px; }
.btn-gold { background: linear-gradient(135deg,var(--balaska-blue),#1A6FE8); color: #fff; box-shadow: 0 8px 30px rgba(20,80,184,0.5); }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid rgba(255,255,255,0.1); margin-top:10px; }

/* Estilos de Jogo */
.q-card { background: var(--card); border-radius: var(--radius); padding: 30px; width: 100%; max-width: 800px; margin-bottom: 20px; text-align: center; }
.q-text { font-size: 22px; font-weight: bold; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 800px; }
.opt { background: var(--card); border: 2px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 15px; cursor: pointer; color: white; text-align: left; }
.opt:hover { border-color: var(--gold); }
.opt.correct { background: var(--green); color: black; }
.opt.wrong { background: var(--red); }

/* Ranking */
.rank-item { background: var(--card); border-radius: 15px; padding: 15px; display: flex; justify-content: space-between; margin-bottom: 8px; width: 100%; max-width: 500px; }
</style>
</head>

<body>
<div id="bg"></div>

<!-- TELA INICIAL -->
<div id="screen-start" class="screen active">
    <div class="logo-ring">
        <img src="https://balaska.com.br/wp-content/uploads/2022/01/logo-balaska.png" alt="Balaska">
    </div>
    <div class="big-title">QUIZ</div>
    <div class="stats-row">
        <div class="stat"><b>07</b><span>Perguntas</span></div>
        <div class="stat"><b>💡</b><span>Com Dicas</span></div>
    </div>
    <button class="btn btn-gold" onclick="showScreen('screen-register')">▶ JOGAR AGORA</button>
    <button class="btn btn-ghost" onclick="loadRanking()">🏆 VER RANKING</button>
</div>

<!-- TELA CADASTRO -->
<div id="screen-register" class="screen">
    <div class="q-card">
        <h2>Quem é você?</h2>
        <input id="userName" type="text" placeholder="Seu Nome" style="width:100%; padding:15px; margin:10px 0; border-radius:10px;">
        <select id="userDept" style="width:100%; padding:15px; margin:10px 0; border-radius:10px;">
            <option value="">Selecione seu setor...</option>
            <option>Produção</option>
            <option>Administrativo</option>
            <option>Logística</option>
            <option>Outro</option>
        </select>
        <button class="btn btn-gold" onclick="startQuiz()">COMEÇAR!</button>
    </div>
</div>

<!-- TELA JOGO -->
<div id="screen-game" class="screen">
    <div class="q-card">
        <div id="questionText" class="q-text">Carregando...</div>
    </div>
    <div id="optionsContainer" class="opts"></div>
</div>

<!-- TELA RANKING -->
<div id="screen-ranking" class="screen">
    <h1 class="big-title" style="font-size: 50px;">RANKING</h1>
    <div id="rankingList" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    <button class="btn btn-ghost" onclick="showScreen('screen-start')">VOLTAR</button>
</div>

<!-- FIREBASE E LÓGICA -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        projectId: "sipat-balaska",
        authDomain: "sipat-balaska.firebaseapp.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const questions = [
        { q: "Qual o uso correto do capacete?", options: ["Sempre com jugular", "Sem jugular", "De lado", "No braço"], correct: 0 },
        { q: "O que significa SIPAT?", options: ["Semana de Prevenção", "Sempre Alerta", "Segurança Total", "Sistema Interno"], correct: 0 },
        { q: "CIPA cuida de quê?", options: ["Acidentes", "Férias", "Vendas", "Limpeza"], correct: 0 },
        { q: "Qual a cor da segurança?", options: ["Verde", "Vermelho", "Preto", "Azul"], correct: 0 },
        { q: "O que é EPI?", options: ["Equipamento Proteção Individual", "Empresa Particular", "Exame Periódico", "Equipe de Proteção"], correct: 0 },
        { q: "De quem é a responsabilidade pela segurança?", options: ["De todos", "Só do técnico", "Só do chefe", "Do governo"], correct: 0 },
        { q: "O que fazer em caso de acidente?", options: ["Avisar supervisor", "Ir embora", "Não contar", "Tirar foto"], correct: 0 }
    ];

    let currentQuestion = 0;
    let score = 0;
    let userData = { name: "", dept: "" };

    window.showScreen = (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };

    window.startQuiz = () => {
        userData.name = document.getElementById('userName').value;
        userData.dept = document.getElementById('userDept').value;
        if(!userData.name || !userData.dept) return alert("Preencha tudo!");
        showScreen('screen-game');
        loadQuestion();
    };

    function loadQuestion() {
        const q = questions[currentQuestion];
        document.getElementById('questionText').innerText = q.q;
        const container = document.getElementById('optionsContainer');
        container.innerHTML = "";
        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'opt';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(i);
            container.appendChild(btn);
        });
    }

    async function checkAnswer(idx) {
        if(idx === questions[currentQuestion].correct) score += 100;
        currentQuestion++;
        if(currentQuestion < questions.length) {
            loadQuestion();
        } else {
            await addDoc(collection(db, "ranking"), {
                nome: userData.name,
                setor: userData.dept,
                pontos: score,
                data: new Date()
            });
            loadRanking();
        }
    }

    window.loadRanking = async () => {
        showScreen('screen-ranking');
        const list = document.getElementById('rankingList');
        list.innerHTML = "Carregando...";
        const q = query(collection(db, "ranking"), orderBy("pontos", "desc"), limit(10));
        const snap = await getDocs(q);
        list.innerHTML = "";
        snap.forEach(doc => {
            const data = doc.data();
            list.innerHTML += `<div class="rank-item"><span>${data.nome} (${data.setor})</span><b>${data.pontos} pts</b></div>`;
        });
    };
</script>
</body>
</html>
