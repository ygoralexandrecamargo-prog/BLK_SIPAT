<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPAT Quiz 2026 — Balaska</title>
    <style>
        :root { --navy: #040919; --blue1: #07122a; --blue2: #0D2B6C; --blue3: #1459B0; --gold: #1A5EE9; --amber: #0D2B6C; --green: #22c55e; --red: #ef4444; --white: #ffffff; --text-dim: #94a3b8; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--navy); color: var(--white); height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .screen { display: none; width: 100%; max-width: 500px; height: 100%; background: var(--blue1); position: relative; flex-direction: column; }
        .screen.active { display: flex; }
        
        /* Estilos Rápidos */
        .header { padding: 20px; background: var(--blue2); text-align: center; border-bottom: 3px solid var(--gold); }
        .content { padding: 20px; flex: 1; overflow-y: auto; }
        .btn { background: var(--gold); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid var(--blue3); background: var(--navy); color: white; }
        .opt { background: var(--blue2); padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; border: 1px solid var(--blue3); display: flex; align-items: center; }
        .opt:hover { background: var(--blue3); }
        .correct { background: var(--green) !important; }
        .wrong { background: var(--red) !important; }
        .rank-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid var(--blue3); }
        #feedback-overlay { position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; font-size: 2rem; font-weight: bold; }
    </style>
</head>
<body>

    <!-- TELA DE REGISTRO -->
    <div id="screen-register" class="screen active">
        <div class="header"><h2>SIPAT 2026 - BALASKA</h2></div>
        <div class="content">
            <label>Nome:</label>
            <input type="text" id="inp-name" placeholder="Seu nome">
            <label>Setor:</label>
            <select id="inp-dept">
                <option value="">Selecione...</option>
                <option value="Administrativo">Administrativo</option>
                <option value="Produção">Produção</option>
                <option value="Logística">Logística</option>
                <option value="Comercial">Comercial</option>
                <option value="Outro">Outro...</option>
            </select>
            <div id="field-outro" style="display:none">
                <input type="text" id="inp-outro" placeholder="Qual setor?">
            </div>
            <button class="btn" onclick="startGame()">INICIAR QUIZ</button>
            <button class="btn" style="background:#444" onclick="showRanking()">VER RANKING</button>
        </div>
    </div>

    <!-- TELA DE ESPERA / NEXT -->
    <div id="screen-next" class="screen">
        <div class="content" style="text-align:center; padding-top:100px;">
            <h1 id="cd-num" style="font-size:5rem">3</h1>
            <p>Prepare-se, <span id="next-name"></span>!</p>
            <svg width="100" height="100"><circle id="ring-fill" cx="50" cy="50" r="35" fill="none" stroke="#1A5EE9" stroke-width="8" /></svg>
        </div>
    </div>

    <!-- TELA DO JOGO -->
    <div id="screen-game" class="screen">
        <div class="header">
            <div id="gh-plabel">Pergunta 1 de 7</div>
            <div style="font-size: 1.5rem; font-weight: bold;">Pontos: <span id="gh-score">0</span></div>
        </div>
        <div class="content">
            <div id="cat-pill" class="cat-pill">🧤 EPI e EPC</div>
            <h3 id="q-text" style="margin: 15px 0;">Carregando pergunta...</h3>
            <div id="opts"></div>
            <button id="btn-hint" class="btn" style="background:#555" onclick="useHint()">💡 DICA</button>
            <div id="hint-box" style="margin-top:10px; font-style:italic; color:#ffd700; display:none"></div>
        </div>
        <div id="feedback-overlay"></div>
    </div>

    <!-- TELA RANKING POS-BLOCO -->
    <div id="screen-block-rank" class="screen">
        <div class="header"><h3>RANKING ATUAL</h3></div>
        <div class="content" id="br-list"></div>
        <button class="btn" onclick="continueAfterBlock()">PRÓXIMO PARTICIPANTE</button>
    </div>

    <!-- TELA RANKING GERAL -->
    <div id="screen-ranking" class="screen">
        <div class="header"><h3>TOP RANKING</h3></div>
        <div class="content" id="rank-list"></div>
        <button class="btn" onclick="goTo('screen-register')">VOLTAR</button>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBBZ-wkPE-O6xlEaY_VY_yszAvSzPqYi1g",
            authDomain: "sipat-balaska.firebaseapp.com",
            projectId: "sipat-balaska",
            storageBucket: "sipat-balaska.firebasestorage.app",
            messagingSenderId: "843068034203",
            appId: "1:843068034203:web:5aad2089bc7b58549f8a3e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rankingRef = doc(db, "sipat_quiz", "ranking_online");

        window.firebaseAPI = {
            saveRanking: async (data) => { try { await setDoc(rankingRef, { ranking: data }); } catch(e) { console.error(e); } },
            loadRanking: async () => { try { const s = await getDoc(rankingRef); return s.exists() ? s.data().ranking : []; } catch(e) { return []; } }
        };
    </script>

    <script>
        // PERGUNTAS
        const Q = [
            {cat:'epi', q:'Para que serve a máscara PFF2?', a:['Gases','Partículas','Cimento','Hospital'], c:1, h:'PFF = Peça Facial Filtrante.'},
            {cat:'epi', q:'Função da proteção lateral nos óculos?', a:['Visão','Partículas laterais','Luz','Estética'], c:1, h:'Protege contra respingos de lado.'},
            {cat:'seg', q:'Incêndio Classe A é em?', a:['Líquidos','Sólidos (madeira/papel)','Elétrico','Metais'], c:1, h:'Materiais que deixam brasas.'},
            {cat:'epi', q:'O que é o NRRsf?', a:['Norma','Atenuação de ruído','Registro','Risco'], c:1, h:'Medida de proteção auditiva.'},
            {cat:'seg', q:'Por que não usar água em fogo elétrico?', a:['Não apaga','Conduz eletricidade','Estraga','Não há restrição'], c:1, h:'Risco de choque térmico e elétrico.'},
            {cat:'epi', q:'EPI para objetos cortantes?', a:['Látex','Malha de aço/Raspa','Cirúrgica','Nenhuma'], c:1, h:'Precisa de resistência mecânica.'},
            {cat:'seg', q:'O que é o Triângulo do Fogo?', a:['Sinal','Elementos do fogo','Extintores','Etapas'], c:1, h:'Calor, Combustível e Comburente.'}
        ];

        let S = { player:{}, score:0, bqi:0, ranking:[], answered:false };

        window.addEventListener('load', async () => { if(window.firebaseAPI) S.ranking = await window.firebaseAPI.loadRanking(); });

        function goTo(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

        function startGame(){
            const n = document.getElementById('inp-name').value;
            const d = document.getElementById('inp-dept').value;
            if(!n || !d) return alert('Preencha tudo!');
            S.player = {name:n, dept:d}; S.score=0; S.bqi=0;
            showNextPlayer();
        }

        function showNextPlayer(){
            goTo('screen-next');
            let secs = 3;
            const num = document.getElementById('cd-num');
            const itv = setInterval(()=>{
                secs--; num.textContent = secs;
                if(secs<=0){ clearInterval(itv); goTo('screen-game'); renderQuestion(); }
            },1000);
        }

        function renderQuestion(){
            const q = Q[S.bqi]; S.answered = false;
            document.getElementById('gh-plabel').textContent = `Pergunta ${S.bqi+1} de 7`;
            document.getElementById('q-text').textContent = q.q;
            const box = document.getElementById('opts'); box.innerHTML = '';
            q.a.forEach((text, i) => {
                const b = document.createElement('button'); b.className = 'opt';
                b.innerHTML = `<span>${text}</span>`;
                b.onclick = () => { if(S.answered) return; S.answered=true;
                    const isOk = (i === q.c);
                    if(isOk) { S.score += 10; b.classList.add('correct'); } else { b.classList.add('wrong'); }
                    document.getElementById('gh-score').textContent = S.score;
                    setTimeout(()=>{ S.bqi++; if(S.bqi < 7) renderQuestion(); else finish(); }, 1000);
                };
                box.appendChild(b);
            });
        }

        function useHint(){ document.getElementById('hint-box').textContent = Q[S.bqi].h; document.getElementById('hint-box').style.display='block'; }

        async function finish(){
            S.ranking.push({name: S.player.name, dept: S.player.dept, score: S.score});
            S.ranking.sort((a,b)=>b.score - a.score);
            if(window.firebaseAPI) await window.firebaseAPI.saveRanking(S.ranking);
            showBlockRanking();
        }

        function showBlockRanking(){
            goTo('screen-block-rank');
            document.getElementById('br-list').innerHTML = S.ranking.map(r=>`<div class="rank-item"><span>${r.name}</span><span>${r.score}</span></div>`).join('');
        }

        function continueAfterBlock(){ location.reload(); }
        
        function showRanking(){
            goTo('screen-ranking');
            document.getElementById('rank-list').innerHTML = S.ranking.map(r=>`<div class="rank-item"><span>${r.name}</span><span>${r.score}</span></div>`).join('');
        }
    </script>
</body>
</html>
