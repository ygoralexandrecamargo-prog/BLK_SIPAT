// 2. FUNÇÃO PARA SALVAR PONTUAÇÃO ONLINE (SEM DANIFICAR)
async function salvarNoRankingOnline(nome, setor, pontos) {
    try {
        await db.collection("ranking").add({
            nome: nome,
            setor: setor,
            pontos: parseInt(pontos),
            data: new Date()
        });
        console.log("Ranking atualizado na nuvem!");
    } catch (e) {
        console.error("Erro ao salvar online: ", e);
    }
}

// 3. FUNÇÃO PARA MOSTRAR RANKING ONLINE
async function carregarRankingOnline() {
    const list = document.getElementById('rank-list');
    list.innerHTML = "<div class='empty-rank'>Carregando posições...</div>";

    try {
        const snapshot = await db.collection("ranking")
            .orderBy("pontos", "desc")
            .limit(10)
            .get();

        list.innerHTML = "";
        if (snapshot.empty) {
            list.innerHTML = "<div class='empty-rank'>Nenhum registro. Seja o primeiro!</div>";
            return;
        }

        let pos = 1;
        snapshot.forEach(doc => {
            const d = doc.data();
            const item = document.createElement('div');
            item.className = "rank-item";
            item.innerHTML = `
                <div class="rank-pos p${pos <= 3 ? pos : 'N'}">${pos}</div>
                <div class="rank-info">
                    <div class="rank-name">${d.nome}</div>
                    <div class="rank-dept">${d.setor}</div>
                </div>
                <div class="rank-right">
                    <div class="rank-score">${d.pontos}</div>
                </div>
            `;
            list.appendChild(item);
            pos++;
        });
    } catch (e) {
        list.innerHTML = "<div class='empty-rank'>Erro ao carregar. Verifique o console.</div>";
    }
}
