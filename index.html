<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SIPAT Quiz - Balaska</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #040810; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .screen { display: none; }
        .active { display: block; }
        .btn { padding: 15px; width: 200px; margin: 10px; cursor: pointer; background: #1450B8; color: white; border: none; border-radius: 5px; }
        input, select { padding: 10px; width: 80%; max-width: 300px; margin: 10px; }
        .rank-item { border-bottom: 1px solid #222; padding: 10px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <!-- INÍCIO -->
    <div id="screen-start" class="screen active">
        <h1>QUIZ SIPAT 2026</h1>
        <button class="btn" onclick="goTo('screen-reg')">JOGAR</button>
        <button class="btn" onclick="carregarRanking()">RANKING</button>
    </div>

    <!-- REGISTRO -->
    <div id="screen-reg" class="screen">
        <input type="text" id="nome" placeholder="Seu Nome">
        <input type="text" id="setor" placeholder="Seu Setor">
        <button class="btn" onclick="iniciar()">COMEÇAR</button>
    </div>

    <!-- JOGO -->
    <div id="screen-game" class="screen">
        <h2 id="pergunta"></h2>
        <div id="opcoes"></div>
    </div>

    <!-- RANKING -->
    <div id="screen-rank" class="screen">
        <h2>TOP 10</h2>
        <div id="lista-rank">Carregando...</div>
        <button class="btn" onclick="location.reload()">VOLTAR</button>
    </div>

    <!-- SCRIPTS FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script>
        // CONFIGURAÇÃO
        const firebaseConfig = {
            apiKey: "AIzaSyBBZ-wkPE-O6xlEaY_VY_yszAvSzPqYi1g",
            authDomain: "sipat-balaska.firebaseapp.com",
            projectId: "sipat-balaska",
            storageBucket: "sipat-balaska.firebasestorage.app",
            messagingSenderId: "843068034203",
            appId: "1:843068034203:web:5aad2089bc7b58549f8a3e"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let pontos = 0;
        const perguntas = [
            { q: "Use EPI?", o: ["Sim", "Não"], a: 0 },
            { q: "CIPA é importante?", o: ["Não", "Sim"], a: 1 }
        ];

        function goTo(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function iniciar() {
            if(!document.getElementById('nome').value) return alert("Nome!");
            goTo('screen-game');
            showQ(0);
        }

        function showQ(i) {
            if(i >= perguntas.length) return finalizar();
            const p = perguntas[i];
            document.getElementById('pergunta').innerText = p.q;
            const div = document.getElementById('opcoes');
            div.innerHTML = "";
            p.o.forEach((opt, idx) => {
                const b = document.createElement('button');
                b.className = "btn";
                b.innerText = opt;
                b.onclick = () => {
                    if(idx === p.a) pontos += 100;
                    showQ(i+1);
                };
                div.appendChild(b);
            });
        }

        function finalizar() {
            const nome = document.getElementById('nome').value;
            const setor = document.getElementById('setor').value;
            
            db.collection("ranking").add({
                nome: nome,
                setor: setor,
                pontos: pontos,
                data: new Date()
            }).then(() => carregarRanking());
        }

        function carregarRanking() {
            goTo('screen-rank');
            const lista = document.getElementById('lista-rank');
            db.collection("ranking").orderBy("pontos", "desc").limit(10).get().then(snap => {
                lista.innerHTML = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    lista.innerHTML += `<div class="rank-item"><span>${d.nome}</span> <b>${d.pontos}</b></div>`;
                });
            });
        }
    </script>
</body>
</html>
