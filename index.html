<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPAT Quiz 2026 — Balaska Equipamentos</title>
    <!-- O CSS permanece o mesmo que você enviou para manter o layout idêntico -->
    <style>
        /* [Seu CSS completo aqui - Mantive exatamente como você enviou] */
        :root { --navy: #040810; --navy2: #07122A; --blue: #0D3B8C; --blue2: #1450B8; --gold: #1A6FE8; --amber: #0D3B8C; --green: #00E676; --red: #FF1744; --white: #E8EEFF; --muted: #4D6899; --card: rgba(7,18,42,0.85); --border: rgba(20,80,184,0.35); --radius: 18px; --glow-g: 0 0 28px rgba(0,230,118,0.45); --glow-r: 0 0 28px rgba(255,23,68,0.45); --balaska-blue: #1450B8; }
        *,::before,::after { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; overflow:hidden; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--navy); color: var(--white); display: flex; align-items: center; justify-content: center; }
        #bg { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse 80% 60% at 15% 20%, rgba(13,59,140,0.4) 0%, transparent 55%), radial-gradient(ellipse 60% 80% at 85% 75%, rgba(20,80,184,0.15) 0%, transparent 50%), radial-gradient(ellipse 100% 100% at 50% 50%, #040810 35%, #000408 100%); }
        #bg::after { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(20,80,184,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(20,80,184,0.06) 1px, transparent 1px); background-size: 52px 52px; }
        .orb { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: 0; animation: orbDrift 18s ease-in-out infinite alternate; }
        .orb1 { width:500px; height:500px; background:rgba(13,59,140,0.22); top:-10%; left:-5%; }
        .orb2 { width:400px; height:400px; background:rgba(20,80,184,0.12); bottom:-5%; right:-5%; animation-delay:-9s; }
        @keyframes orbDrift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(40px,30px) scale(1.08); } }
        .screen { position: relative; z-index: 1; display: none; width: 100vw; height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 24px; overflow: hidden; }
        .screen.active { display: flex; }
        .big-title { font-family: Impact; font-size: clamp(80px,13vw,140px); line-height: .9; background: linear-gradient(135deg,#ffffff 0%,#7EB8FF 45%,var(--balaska-blue) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 5s linear infinite; }
        @keyframes shimmer { 0% { background-position: 200% center; } 100% { background-position: -200% center; } }
        .btn { font-family: 'Segoe UI'; font-weight: 900; font-size: 18px; letter-spacing: 3px; text-transform: uppercase; border: none; border-radius: 50px; cursor: pointer; padding: 18px 60px; transition: transform .15s; }
        .btn-gold { background: linear-gradient(135deg,var(--balaska-blue),#1A6FE8); color: #ffffff; box-shadow: 0 8px 30px rgba(20,80,184,0.5); }
        .glass-card { background: var(--card); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 24px; padding: 44px 40px; width: min(460px,90vw); }
        .field input, .field select { width: 100%; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px 16px; color: white; margin-bottom: 15px; }
        /* [Omiti o restante do CSS por brevidade, mas ele deve estar presente no seu arquivo final] */
    </style>
</head>
<body>
    <div id="bg"></div>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <!-- FEEDBACK OVERLAY (Aparece ao acertar/errar) -->
    <div id="feedback-overlay">
        <span class="fb-emoji" id="fb-emoji"></span>
        <div class="fb-word" id="fb-word"></div>
    </div>

    <!-- TELAS (START, REGISTER, NEXT, GAME, RESULT, RANKING, BLOCK) -->
    <!-- [Mantenha a estrutura HTML das telas que você enviou] -->
    <!-- Vou focar na lógica do Script que faz seu layout funcionar agora -->

    <script>
        // CONFIGURAÇÃO DO QUIZ
        const questions = [
            { q: "Qual o EPI indispensável para proteção auricular?", opts: ["Protetor tipo concha", "Luva de látex", "Capacete", "Óculos"], ans: 0, hint: "É usado nas orelhas.", cat: "EPI", diff: "Fácil" },
            { q: "O que significa a sigla SIPAT?", opts: ["Sempre Importante Prevenir Acidentes", "Semana Interna de Prevenção de Acidentes", "Sistema de Integração e Prevenção", "Segurança Interna de Proteção"], ans: 1, hint: "É um evento anual obrigatório.", cat: "Normas", diff: "Médio" }
            // Adicione as 50 perguntas aqui...
        ];

        let currentUser = { name: "", dept: "", score: 0, hits: 0 };
        let currentQIndex = 0;
        const totalQuestions = 7; // Perguntas por rodada

        function goTo(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showRegister() { goTo('screen-register'); }

        function startGame() {
            const name = document.getElementById('inp-name').value;
            const dept = document.getElementById('inp-dept').value;
            if(!name || !dept) return alert("Preencha seus dados!");

            currentUser = { name, dept, score: 0, hits: 0 };
            currentQIndex = 0;
            
            // Tela de Próximo Jogador com Countdown
            document.getElementById('next-name').innerText = name;
            document.getElementById('next-dept').innerText = dept;
            goTo('screen-next');
            
            let count = 3;
            const timer = setInterval(() => {
                count--;
                document.getElementById('cd-num').innerText = count;
                if(count <= 0) {
                    clearInterval(timer);
                    loadQuestion();
                    goTo('screen-game');
                }
            }, 1000);
        }

        function loadQuestion() {
            const q = questions[currentQIndex];
            document.getElementById('gh-name').innerText = currentUser.name;
            document.getElementById('gh-dept').innerText = currentUser.dept;
            document.getElementById('q-text').innerText = q.q;
            document.getElementById('gh-plabel').innerText = `Pergunta ${currentQIndex + 1} de ${totalQuestions}`;
            document.getElementById('prog-bar').style.width = `${((currentQIndex + 1) / totalQuestions) * 100}%`;
            
            const optsDiv = document.getElementById('opts');
            optsDiv.innerHTML = "";
            q.opts.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "opt";
                btn.innerHTML = `<div class="opt-letter">${String.fromCharCode(65 + i)}</div> <span>${opt}</span>`;
                btn.onclick = () => checkAnswer(i);
                optsDiv.appendChild(btn);
            });
            
            document.getElementById('hint-box').style.display = "none";
            document.getElementById('btn-hint').disabled = false;
        }

        function checkAnswer(idx) {
            const q = questions[currentQIndex];
            const btns = document.querySelectorAll('.opt');
            btns.forEach(b => b.disabled = true);

            if(idx === q.ans) {
                btns[idx].classList.add('correct');
                currentUser.score += 100;
                currentUser.hits++;
                showFeedback(true);
            } else {
                btns[idx].classList.add('wrong');
                btns[q.ans].classList.add('reveal-correct');
                showFeedback(false);
            }

            document.getElementById('gh-score').innerText = currentUser.score;

            setTimeout(() => {
                currentQIndex++;
                if(currentQIndex < totalQuestions) {
                    loadQuestion();
                } else {
                    finishGame();
                }
            }, 2000);
        }

        function showFeedback(isCorrect) {
            const overlay = document.getElementById('feedback-overlay');
            const emoji = document.getElementById('fb-emoji');
            const word = document.getElementById('fb-word');
            
            overlay.className = isCorrect ? 'show fb-correct' : 'show fb-wrong';
            emoji.innerText = isCorrect ? '✅' : '❌';
            word.innerText = isCorrect ? 'CORRETO!' : 'OPS...';
            
            setTimeout(() => overlay.classList.remove('show'), 1500);
        }

        function useHint() {
            const q = questions[currentQIndex];
            const box = document.getElementById('hint-box');
            box.innerText = q.hint;
            box.style.display = "block";
            document.getElementById('btn-hint').disabled = true;
            currentUser.score -= 20; // Penalidade por dica
            document.getElementById('gh-score').innerText = currentUser.score;
        }

        function finishGame() {
            saveScore();
            document.getElementById('res-name').innerText = currentUser.name;
            document.getElementById('res-big').innerText = currentUser.score;
            document.getElementById('res-acertos').innerText = `${currentUser.hits} acertos de ${totalQuestions} perguntas`;
            document.getElementById('res-bar').style.width = `${(currentUser.hits / totalQuestions) * 100}%`;
            goTo('screen-result');
        }

        function saveScore() {
            let ranking = JSON.parse(localStorage.getItem('quiz_ranking') || '[]');
            ranking.push(currentUser);
            ranking.sort((a, b) => b.score - a.score);
            localStorage.setItem('quiz_ranking', JSON.stringify(ranking.slice(0, 10)));
        }

        function showRanking() {
            const list = document.getElementById('rank-list');
            const ranking = JSON.parse(localStorage.getItem('quiz_ranking') || '[]');
            
            if(ranking.length === 0) {
                list.innerHTML = `<div class="empty-rank">Nenhum recorde ainda.<br>Seja o primeiro a jogar!</div>`;
            } else {
                list.innerHTML = ranking.map((player, i) => `
                    <div class="rank-item">
                        <div class="rank-pos p${i+1}">${i+1}</div>
                        <div class="rank-info">
                            <div class="rank-name">${player.name}</div>
                            <div class="rank-dept">${player.dept}</div>
                        </div>
                        <div class="rank-right">
                            <div class="rank-score">${player.score}</div>
                            <div class="rank-hits">${player.hits} ACERTOS</div>
                        </div>
                    </div>
                `).join('');
            }
            goTo('screen-ranking');
        }
    </script>
</body>
</html>
